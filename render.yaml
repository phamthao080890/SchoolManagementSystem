services:
  - type: web
    runtime: node
    name: school-management-api
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://school-management-client-tn6o.onrender.com
      - key: API_BASE_URL
        value: https://school-management-api-tn6o.onrender.com
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false

  - type: web
    runtime: static
    name: school-management-client
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://school-management-api-tn6o.onrender.com
